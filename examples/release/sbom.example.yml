# EXAMPLE (optional): attach an SPDX SBOM to every GitHub release (SLSA/supply-chain hygiene).
name: sbom
on:
  release:
    types: [published]
permissions: {}
jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the SBOM as a release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          upload-release-assets: true
