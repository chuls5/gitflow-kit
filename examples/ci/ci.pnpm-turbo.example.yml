# EXAMPLE (pnpm + Turborepo monorepo, from the source project). Copy to .github/workflows/ and adapt.
# Keep the job names `check` and `build` if you want to reuse the required-check list in README.md.
name: ci
# Minutes budget: docs-only changes skip CI; release/hotfix branches are covered by their PR runs.
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  push:
    branches: [main, develop]
    paths-ignore: ["**/*.md", "docs/**"]
# Least privilege: jobs only read the repo (artifacts and the pnpm cache use the runtime token).
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
