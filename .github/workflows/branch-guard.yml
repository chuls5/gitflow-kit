name: branch-guard
# Free-plan private repos can't use branch protection, so this flags Git flow violations.
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
permissions: {}
concurrency:
  group: branch-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  pr-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Only release/* and hotfix/* may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Keep in sync with pr-lint.yml's `base` job and CONTRIBUTING.md: develop reaches main only via a release/* branch.
          case "$HEAD_REF" in
            release/*|hotfix/*) echo "OK: $HEAD_REF -> main" ;;
            *) echo "::error::PRs into main must come from release/* or hotfix/* (got '$HEAD_REF'). Cut release/x.y.z from develop (or hotfix/x.y.z from main), or retarget this PR to develop."; exit 1 ;;
          esac
  # Tripwire for the known gap: GitHub reads workflow files from the PR itself, so a PR could weaken
  # review-gate.yml or this file. Any change to the process/guard files fails until the OWNER adds the
  # `gate-change: approved` label after reading the diff. (A PR could also edit this job; CODEOWNERS and
  # the reviewer agent flag that. Rulesets on paid/public repos close the gap fully.)
  gate-tripwire:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    steps:
      - name: Changes to gate/guard files need the owner's label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: "gate-change: approved"
        run: |
          # KIT: keep in sync with the CODEOWNERS block for process files.
          pattern='^(\.github/(workflows|scripts|guards|actions)/|\.github/CODEOWNERS$|\.github/dependabot\.yml$|\.githooks/|tools/(guards|review-gate)/|\.gitleaks\.toml$|\.gitattributes$|scripts/verify\.sh$)'
          hits=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | grep -E "$pattern" || true)
          [ -n "$hits" ] || { echo "No gate/guard files changed."; exit 0; }
          echo "Gate/guard files changed:"; printf '%s\n' "$hits" | sed 's/^/  /'
          actor=$(gh api --paginate "repos/$REPO/issues/$PR/events" \
            --jq '[.[] | select(.event == "labeled" and .label.name == env.LABEL)] | last | .actor.login // empty' | tail -n1)
          labelled=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -Fx "$LABEL" || true)
          if [ -n "$labelled" ] && [ "$actor" = "$OWNER" ]; then
            echo "::notice::Owner approved the gate change with \"$LABEL\"."; exit 0
          fi
          echo "::error::This PR changes process/guard files. The owner must review the diff and add the \"$LABEL\" label (re-add it after new pushes)."
          exit 1
  direct-push:
    # KIT_TEMPLATE=true (repo variable) is set only on the kit's own repo, which is maintained by direct pushes.
    if: github.event_name == 'push' && vars.KIT_TEMPLATE != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Verify head commit came from a merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          merged=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          if [ "${merged:-0}" -gt 0 ]; then
            echo "OK: $SHA on $BRANCH is from a merged PR"; exit 0
          fi
          msg="Direct push to \`$BRANCH\` detected: commit $SHA by @$ACTOR is not associated with a merged pull request. See docs/git-flow.md."
          echo "::error::$msg"
          gh label create direct-push --repo "$REPO" --color B60205 --description "Commit landed without a PR" 2>/dev/null || true
          gh issue create --repo "$REPO" --title "Direct push to $BRANCH (${SHA:0:7})" --label direct-push \
            --body "$msg"$'\n\n'"Run: ${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}" || true
          exit 1
