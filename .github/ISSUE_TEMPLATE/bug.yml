name: Bug
description: Something is broken
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: "What happened and what did you expect?", description: "No secrets, tokens or personal data." }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, placeholder: "1. ...\n2. ..." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit / environment }
  - type: textarea
    id: touches
    attributes: { label: Touches (paths likely involved), description: Helps scope the agent's ticket. }
